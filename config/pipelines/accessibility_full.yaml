name: accessibility_full
description: Preflight, tagging, PDF/UA normalization, postflight validation, conditional finalization.
version: "3"
steps:
  - id: preflight
    type: validation
    adapter: verapdf
    config:
      input: source_pdf
      output: preflight_validation

  - id: extract
    type: extract
    adapter: opendataloader

  - id: analyze
    type: semantic_analysis
    adapter: opendataloader
    needs: [extract]

  - id: remediate
    type: remediation
    adapter: opendataloader
    needs: [analyze]

  - id: normalize_pdfua
    type: normalization
    adapter: pdfua
    needs: [remediate]
    config:
      input: candidate_pdf
      output: normalized_pdf
      report_output: normalization_report

  - id: postflight
    type: validation
    adapter: verapdf
    needs: [preflight, normalize_pdfua]
    config:
      input: normalized_pdf
      output: validation

  - id: report
    type: report
    adapter: accessibility
    needs: [postflight]
    config:
      validation: validation

  - id: finalize
    type: finalization
    adapter: passthrough
    needs: [report]
    config:
      input: normalized_pdf
      validation: validation
      output: final_pdf
      require_valid: true
