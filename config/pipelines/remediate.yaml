name: remediate
description: Deprecated compatibility alias for structured_pipeline.
version: "1"
steps:
  - id: extract
    type: extract
    adapter: mock
  - id: analyze
    type: semantic_analysis
    adapter: mock
    needs: [extract]
  - id: remediate
    type: remediation
    adapter: mock
    needs: [analyze]
