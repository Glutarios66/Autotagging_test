name: mock_remediation
description: Fully deterministic mock remediation flow.
version: "1"
steps:
  - id: extract
    type: extract
    adapter: mock
  - id: analyze
    type: semantic_analysis
    adapter: mock
    needs: [extract]
  - id: remediate
    type: remediation
    adapter: mock
    needs: [analyze]
  - id: validate
    type: validation
    adapter: mock
    needs: [remediate]
  - id: finalize
    type: finalization
    adapter: mock
    needs: [validate]
  - id: report
    type: report
    adapter: mock
    needs: [validate]
