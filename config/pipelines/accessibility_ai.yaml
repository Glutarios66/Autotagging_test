name: accessibility_ai
description: Experimental AI semantics + OpenDataLoader tagging + full PDF/UA normalization + veraPDF postflight.
version: "3"
steps:
  - id: preflight
    type: validation
    adapter: verapdf
    config:
      input: source_pdf
      output: preflight_validation

  - id: extract
    type: extract
    adapter: pymupdf

  - id: analyze
    type: semantic_analysis
    adapter: openai
    needs: [extract]

  - id: remediate
    type: remediation
    adapter: opendataloader
    needs: [analyze]

  - id: normalize_pdfua
    type: normalization
    adapter: pdfua
    needs: [remediate]
    config:
      input: candidate_pdf
      output: normalized_pdf
      report_output: normalization_report

  - id: postflight
    type: validation
    adapter: verapdf
    needs: [preflight, normalize_pdfua]
    config:
      input: normalized_pdf
      output: validation

  - id: report
    type: report
    adapter: accessibility
    needs: [postflight]

  - id: finalize
    type: finalization
    adapter: passthrough
    needs: [report]
    config:
      input: normalized_pdf
      validation: validation
      output: final_pdf
      require_valid: true
