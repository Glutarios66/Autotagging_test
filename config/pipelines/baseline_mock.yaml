name: baseline_mock
description: Deterministic baseline extraction, remediation, validation, and finalization.
version: "1"
steps:
  - id: baseline
    type: baseline
    adapter: mock
  - id: extract
    type: extract
    adapter: mock
    needs: [baseline]
  - id: analyze
    type: semantic_analysis
    adapter: mock
    needs: [extract]
  - id: remediate
    type: remediation
    adapter: mock
    needs: [analyze]
  - id: validate
    type: validation
    adapter: mock
    needs: [remediate]
  - id: finalize
    type: finalization
    adapter: mock
    needs: [validate]
  - id: report
    type: report
    adapter: mock
    needs: [validate]
