[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-remediation"
version = "0.3.0"
description = "Modular research foundation for AI-assisted PDF accessibility remediation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "pikepdf>=9.4,<11",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]
opendataloader = ["opendataloader-pdf>=2.5,<3"]
all = [
  "psycopg[binary]>=3.2,<4",
  "opendataloader-pdf>=2.5,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_remediation"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pdf_remediation"]
plugins = ["pydantic.mypy"]
