services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn pdf_remediation.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    environment: &app-env
      PDFR_DATABASE_URL: postgresql+psycopg://pdfremediation:pdfremediation@postgres:5432/pdfremediation
      PDFR_ARTIFACT_BACKEND: minio
      PDFR_S3_BUCKET: pdf-remediation
      PDFR_S3_ENDPOINT_URL: http://minio:9000
      PDFR_S3_ACCESS_KEY: minioadmin
      PDFR_S3_SECRET_KEY: minioadmin
      PDFR_CELERY_BROKER_URL: redis://redis:6379/0
      PDFR_CELERY_RESULT_BACKEND: redis://redis:6379/1
      PDFR_CELERY_QUEUE: pdf-remediation
      PDFR_RUN_JOBS_INLINE: "false"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A pdf_remediation.workers.celery_app:celery_app worker -Q pdf-remediation --loglevel=INFO
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdfremediation
      POSTGRES_PASSWORD: pdfremediation
      POSTGRES_DB: pdfremediation
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfremediation"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  minio-data:
